        body {
            margin: 0;

        .cajatítulo {
            background-color: transparent;
            height: 50px;
            width: 100%;
            display: flex;
            align-items: center;
            padding: 0 10px;
            justify-content: space-between;
            box-sizing: border-box;
            position: absolute;
            z-index: 10;
			top:0;}

        .izquierda p a, .derecha p a {
            font-size: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 0;
            font-weight: bold;
            padding: 10px;
            text-decoration: none;
            color: black;}

        .izquierda p a:hover, .derecha p a:hover {
            color: #880808;
            cursor: pointer;
            transition: 0.5s;}

        .izquierda {
            flex: 1;
            display: flex;
            gap: 50px;
            justify-content: flex-start;}

        .centro {
            flex: 0 0 auto;
            width: 100px;
            display: flex;
            justify-content: center;}

        .derecha {
            flex: 1;
            display: flex;
            justify-content: flex-end;}

        .logo-viridiana {
            height: 80px;
            width: auto;
            position: absolute;
            top: 10px;
            z-index: 100;
			left: 50%;
			transform: translateX(-50%)}

        .desplegable {
            position: relative;
            display: inline-block;}

        .contenido-desplegable {
            display: none;
            position: absolute;
            background-color: transparent;
            min-width: 160px;
            z-index: 100;
            padding-top: 3px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;}

        .contenido-desplegable a {
            color: black;
            padding: 8px 8px;
            text-decoration: none;
            display: block;
            font-size: 15px;
            font-weight: bold;
            text-transform: uppercase;}

        .contenido-desplegable a:hover {
            color: #880808;
            cursor: pointer;
            transition: 0.5s;}

        .desplegable:hover .contenido-desplegable {
            display: block;}
			
		.contenedor-contacto {
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			min-height: 80vh;
			text-align: center;}
			
		.img-contacto {
			width: 150px;
			height: auto;
			margin-bottom: 5px;}
			
		.email-contacto {
			font-family: 'Inter', sans-serif;
			font-size: 18px;
			font-weight: bold;
			letter-spacing: 2px;}
			
		.redes-sociales {

            height: auto;
