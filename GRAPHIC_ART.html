		<script>
    
		document.addEventListener("DOMContentLoaded", function() {
        const observerOptions = {
            threshold: 0.1 };

        const observer = new IntersectionObserver((entries, observer) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('aparecer');
                    observer.unobserve(entry.target);}});}, observerOptions);

        const elementos = document.querySelectorAll('.arte-item');
        elementos.forEach(el => observer.observe(el));});

		function abrirModal(elemento) {
        var modal = document.getElementById("modal-visor");
        var imgModal = document.getElementById("img-ampliada");
        var imagenClicada = elemento.getElementsByTagName('img')[0];
        
        modal.style.display = "block";
        imgModal.src = imagenClicada.src;}

		function cerrarModal() {
        document.getElementById("modal-visor").style.display = "none";}
</script>
